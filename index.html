function renderTest(p){
  var ts=ST.tests[p.id]||{sel:{},checked:false};
  ST.tests[p.id]=ts;
  var html="";
  if(ts.checked&&Object.keys(ts.sel).length){
    var c=0;p.test.forEach(function(q,i){if(ts.sel[i]===q.c)c++});
    var pct=Math.round(c/p.test.length*100);
    var cls=pct>=80?"exc":pct>=50?"good":"bad";
    html+='<div class="tscore show '+cls+'"><span class="big">'+c+' / '+p.test.length+'</span><span>'+pct+'% '+(pct>=80?"🎉":pct>=50?"👍":"📚")+'</span></div>';
  }
  p.test.forEach(function(q,qi){
    var sel=ts.sel[qi];
    html+='<div class="tq"><div class="qhead"><div class="qnum">'+(qi+1)+'</div><div class="qtext">'+esc(q.q)+'</div></div><div class="opts">';
    q.o.forEach(function(o,oi){
      var cls="opt";
      if(ts.checked){cls+=" locked";if(oi===q.c)cls+=" ok";else if(sel===oi)cls+=" bad"}
      else if(sel===oi)cls+=" sel";
      var mark="";
      if(oi===q.c&&ts.checked)mark="✓";else if(sel===oi&&ts.checked)mark="✕";else if(sel===oi)mark="●";
      html+='<button class="'+cls+'" data-action="opt" data-qi="'+qi+'" data-oi="'+oi+'"><span class="opt-m">'+mark+'</span><span>'+esc(o)+'</span></button>';
    });
    html+='</div></div>';
  });
  html+='<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">';
  if(!ts.checked)html+='<button class="btn bp" data-action="check" data-pid="'+p.id+'" '+(Object.keys(ts.sel).length===0?"disabled":"")+'>Проверить</button>';

}

function doSearch(q){
  var R=$("sRes");if(!R)return;
  if(!q){R.innerHTML='<div class="empty">Начните печатать…</div>';return}
  q=q.toLowerCase();var res=[];
  DATA.forEach(function(p){
    p.summary.forEach(function(s){if(s.toLowerCase().indexOf(q)!==-1)res.push({t:"Конспект",title:p.title,id:p.id,text:s})});
    if(p.detailed)p.detailed.forEach(function(d){if(d.text.toLowerCase().indexOf(q)!==-1||d.title.toLowerCase().indexOf(q)!==-1)res.push({t:"Подробно",title:p.title,id:p.id,text:d.text})});
    p.test.forEach(function(x){if(x.q.toLowerCase().indexOf(q)!==-1)res.push({t:"Тест",title:p.title,id:p.id,text:x.q})});
    p.questions.forEach(function(x){if(x.q.toLowerCase().indexOf(q)!==-1||x.a.toLowerCase().indexOf(q)!==-1)res.push({t:"Вопрос",title:p.title,id:p.id,text:x.q})});
    p.glossary.forEach(function(x){if(x.t.toLowerCase().indexOf(q)!==-1||x.d.toLowerCase().indexOf(q)!==-1)res.push({t:"Термин",title:p.title,id:p.id,text:x.t+" — "+x.d})});
  });
  if(!res.length){R.innerHTML='<div class="empty">Ничего не найдено 😔</div>';return}
  var re=new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");
  R.innerHTML=res.slice(0,30).map(function(r){return '<button class="sres-item" data-action="go" data-pid="'+r.id+'"><div style="font-size:11px;font-weight:700;color:var(--accent2);margin-bottom:3px">'+r.t+' · '+esc(r.title)+'</div><div style="font-size:12.5px;line-height:1.5">'+esc(r.text).replace(re,"<mark>$1</mark>")+'</div></button>'}).join("");
}

  }).join('');

}

function openNewTab(id){

  try{w=window.open(url,'_blank','noopener,noreferrer')}catch(e){}

  if(blocked){
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(function(){
        toast('📋 Ссылка скопирована — вставьте в адресную строку');
      }).catch(function(){
        prompt('Скопируйте ссылку:',url);
      });

      prompt('Скопируйте ссылку:',url);
    }
  }
}

function initBook(){
  var stage=$("bookStage"),book=$("book3d");if(!stage||!book)return;
  var drag=false,startX=0,startRot=-22,curRot=-22,vel=0,lx=0,lt=0,raf=null,idle;
  function apply(y){book.style.transform="rotateY("+y+"deg) rotateX(8deg)"}
  apply(curRot);
  function resetIdle(){clearTimeout(idle);idle=setTimeout(function(){if(drag)return;var s=function(){if(drag)return;if(Math.abs(curRot+22)<0.5)return;curRot+=(-22-curRot)*0.08;apply(curRot);requestAnimationFrame(s)};s()},4000)}
  function start(e){drag=true;book.classList.add("dragging");startX=e.clientX;startRot=curRot;lx=e.clientX;lt=performance.now();vel=0;if(raf)cancelAnimationFrame(raf);clearTimeout(idle);if(stage.setPointerCapture)stage.setPointerCapture(e.pointerId)}
  function move(e){if(!drag)return;var dx=e.clientX-startX;curRot=Math.max(-55,Math.min(55,startRot+dx*0.5));var n=performance.now(),d=n-lt;if(d>0)vel=(e.clientX-lx)/d*12;lx=e.clientX;lt=n;apply(curRot)}
  function end(){if(!drag)return;drag=false;book.classList.remove("dragging");var inertia=function(){vel*=0.94;curRot+=vel*0.6;if(curRot>55){curRot=55;vel*=-0.5}if(curRot<-55){curRot=-55;vel*=-0.5}apply(curRot);if(Math.abs(vel)<0.2){resetIdle();return}raf=requestAnimationFrame(inertia)};inertia()}
  stage.addEventListener("pointerdown",start);stage.addEventListener("pointermove",move);stage.addEventListener("pointerup",end);stage.addEventListener("pointercancel",end);stage.addEventListener("pointerleave",function(){if(drag)end()});
}

document.addEventListener("click",function(e){
  var t=e.target.closest("[data-action]");if(!t)return;var a=t.dataset.action;
  if(a==="home"){ST.view="home";render();return}
  if(a==="drawer"){openDrawer();return}
  if(a==="closeDrawer"){$("drawer").classList.remove("open");return}
  if(a==="palette"){openPalette();return}
  if(a==="paletteGo"){var idx=+t.dataset.idx;var r=window._paletteRes&&window._paletteRes[idx];if(r&&r.pid!==undefined){closeAll();ST.view="paragraph";ST.pid=r.pid;ST.tab="summary";markViewed(ST.pid);render()}else if(r&&r.a){closeAll();r.a()}return}
  if(a==="search"){$("sInput").value="";$("sRes").innerHTML='<div class="empty">Начните печатать…</div>';openModal("mSearch");setTimeout(function(){$("sInput").focus()},100);return}
  if(a==="theme"){var c=document.documentElement.getAttribute("data-theme");setTheme(c==="dark"?"light":"dark");return}
  if(a==="settings"){renderSettings();openModal("mSettings");return}
  if(a==="pdf"){printParagraph(t.dataset.pid?+t.dataset.pid:ST.pid);return}
  if(a==="printAll"){printAll();return}
  if(a==="examModal"){var ed=$("examDate");var saved=DB.get("exam",null);if(ed&&saved)ed.value=saved;openModal("mExam");return}
  if(a==="examSave"){if($("examDate").value){DB.set("exam",$("examDate").value);closeModal("mExam");render();toast("Дата сохранена")}return}
  if(a==="examClear"){DB.set("exam",null);closeModal("mExam");render();return}
  if(a==="flash"){openFlash();return}
  if(a==="flashRestart"){openFlash();return}
  if(a==="flipCard"){ST.flash.flip=!ST.flash.flip;renderFlash();return}
  if(a==="flashNo"){ST.flash.unknown++;ST.flash.idx++;ST.flash.flip=false;renderFlash();return}
  if(a==="flashYes"){ST.flash.known++;ST.flash.idx++;ST.flash.flip=false;renderFlash();return}
  if(a==="personas"){openPersonas();return}
  if(a==="hotkeys"){openHotkeys();return}
  if(a==="help"){toast("Нажмите 📚 для списка параграфов, ⌘ для поиска");return}
  if(a==="newTab"){openNewTab(+t.dataset.pid);return}
  if(a==="copyTerm"){var term=t.dataset.term;if(navigator.clipboard){navigator.clipboard.writeText(term).then(function(){toast("📋 "+term)}).catch(function(){toast("Не удалось")})}return}
  if(a==="go"){e.stopPropagation();closeAll();ST.view="paragraph";ST.pid=+t.dataset.pid;ST.tab="summary";markViewed(ST.pid);render();return}
  if(a==="goSec"){e.stopPropagation();var si=+t.dataset.si;var sec=SECTIONS[si];if(sec&&sec.ids[0]!==undefined){closeAll();ST.view="paragraph";ST.pid=sec.ids[0];ST.tab="summary";markViewed(ST.pid);render()}return}
  if(a==="nav"){var v=t.dataset.pid;if(v&&v!=="null"){ST.pid=+v;ST.tab="summary";markViewed(ST.pid);render()}return}
  if(a==="bm"){e.stopPropagation();toggleBM(+t.dataset.bm);return}
  if(a==="toggleSec"){var si2=+t.dataset.si;ST.collapsed[si2]=!ST.collapsed[si2];t.closest(".sec").classList.toggle("collapsed");return}
  if(a==="tab"){ST.tab=t.dataset.tab;render();return}
  if(a==="opt"){var ts=ST.tests[ST.pid];if(!ts||ts.checked)return;ts.sel[+t.dataset.qi]=+t.dataset.oi;render();return}
  if(a==="check"){var p=DATA.find(function(x){return x.id===ST.pid});if(!p)return;var tst=ST.tests[ST.pid];tst.checked=true;var corr=0;p.test.forEach(function(q,i){if(tst.sel[i]===q.c)corr++});saveTest(ST.pid,corr,p.test.length);render();return}
  if(a==="retry"){delete ST.tests[ST.pid];render();return}
  if(a==="qtoggle"){var qi=+t.dataset.qi;var ans=document.querySelector('[data-qans="'+qi+'"]');if(ans){ans.classList.toggle("open");t.textContent=ans.classList.contains("open")?"Скрыть":"Показать"}return}
  if(a==="setTheme"){setTheme(t.dataset.val);return}
  if(a==="setAccent"){setAccent(t.dataset.val);return}
  if(a==="setSize"){setSize(t.dataset.val);return}
  if(a==="toggleTrail"){setTrail(document.body.getAttribute("data-trail")==="on"?"off":"on");return}
});

  var inInput=["INPUT","TEXTAREA","SELECT"].indexOf(e.target.tagName)!==-1;
  if(e.key==="Escape"){closeAll();return}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();openPalette();return}

  if(k==="s"){e.preventDefault();$("sInput").value="";$("sRes").innerHTML='<div class="empty">Начните печатать…</div>';openModal("mSearch");setTimeout(function(){$("sInput").focus()},100)}

  else if(k==="t"){e.preventDefault();var c=document.documentElement.getAttribute("data-theme");setTheme(c==="dark"?"light":"dark")}
  else if(k==="d"){e.preventDefault();openDrawer()}
  else if(e.key==="ArrowLeft"&&ST.view==="paragraph"&&ST.pid>0){ST.pid--;ST.tab="summary";markViewed(ST.pid);render()}
  else if(e.key==="ArrowRight"&&ST.view==="paragraph"&&ST.pid<DATA.length-1){ST.pid++;ST.tab="summary";markViewed(ST.pid);render()}
});

var tsx=0,tsy=0;
document.addEventListener("touchstart",function(e){tsx=e.touches[0].clientX;tsy=e.touches[0].clientY},{passive:true});
document.addEventListener("touchend",function(e){
  if(ST.view!=="paragraph")return;
  var dx=e.changedTouches[0].clientX-tsx,dy=e.changedTouches[0].clientY-tsy;
  if(Math.abs(dx)<80||Math.abs(dy)>Math.abs(dx))return;
  if(dx>0&&ST.pid>0){ST.pid--;ST.tab="summary";markViewed(ST.pid);render()}
  else if(dx<0&&ST.pid<DATA.length-1){ST.pid++;ST.tab="summary";markViewed(ST.pid);render()}
},{passive:true});

document.addEventListener("click",function(e){if(e.target.id==="btt")window.scrollTo({top:0,behavior:"smooth"})});

document.addEventListener("visibilitychange",function(){
  if(document.hidden){trailActive=false;clearTimeout(trailTimer)}
});

function boot(){
  setTheme(localStorage.getItem("ob_theme")||"light");
  var acc=DB.get("accent","burgundy");
  document.documentElement.setAttribute("data-accent",acc);
  document.documentElement.setAttribute("data-size",DB.get("size","normal"));
  document.body.setAttribute("data-trail",DB.get("trail","on"));
  loadBookmarks();initStreak();
  var m=location.hash.match(/^#p(\d+)$/);
  if(m){var id=+m[1];if(id>=0&&id<DATA.length){ST.view="paragraph";ST.pid=id;markViewed(id)}}
  render();
}
boot();
</script>
</body>
</html>
