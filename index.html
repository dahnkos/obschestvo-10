<!DOCTYPE html>
<html lang="ru" data-theme="light" data-accent="burgundy" data-size="normal">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#8b2942">
<title>Обществоведение 10 класс</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Cormorant+Garamond:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#8b2942;--accent2:#5a1a2b;--accent3:#d4607a;
  --bg1:#e9dfd1;--bg2:#e3d5c3;--bg3:#ece1d1;
  --mesh1:rgba(160,80,100,.16);--mesh2:rgba(110,90,150,.13);
  --mesh3:rgba(190,150,90,.14);--mesh4:rgba(80,120,150,.12);
  --text:#3a2f33;--text2:#6a5e5c;--text3:#9a8e88;
  --card:rgba(248,242,230,.92);--card2:rgba(251,246,236,.96);
  --border:rgba(255,250,240,.8);--divider:rgba(90,50,50,.10);
  --shadow:0 4px 16px rgba(90,50,50,.07);--shadow2:0 8px 28px rgba(90,50,50,.14);
  --foil:#c9a05a;--success:#4a7a5a;--successBg:rgba(74,122,90,.14);
  --error:#a84040;--errorBg:rgba(168,64,64,.13);--fs:1;
}
[data-theme="dark"]{
  --accent:#d4607a;--accent2:#f0a0b0;--accent3:#8b2942;
  --bg1:#0c0810;--bg2:#15101c;--bg3:#110d18;
  --mesh1:rgba(212,96,122,.30);--mesh2:rgba(120,90,180,.25);
  --mesh3:rgba(210,160,90,.22);--mesh4:rgba(90,140,180,.24);
  --text:#f2e4e0;--text2:#b8a5a5;--text3:#7d6a6a;
  --card:rgba(46,30,40,.85);--card2:rgba(55,38,48,.92);
  --border:rgba(255,255,255,.08);--divider:rgba(255,255,255,.08);
  --shadow:0 6px 24px rgba(0,0,0,.5);--shadow2:0 10px 36px rgba(0,0,0,.7);
  --foil:#f0c080;--success:#6dc19a;--successBg:rgba(109,193,154,.15);
  --error:#e09090;--errorBg:rgba(224,144,144,.14);
}
[data-theme="dark"][data-accent="emerald"]{--accent:#6dc19a;--accent2:#b0e8cc;--foil:#e0c088}
[data-theme="dark"][data-accent="sapphire"]{--accent:#8aaef0;--accent2:#c0d4f8;--foil:#e0c088}
[data-theme="dark"][data-accent="amber"]{--accent:#e8c060;--accent2:#f8e0a0;--foil:#f0d090}
[data-theme="dark"][data-accent="plum"]{--accent:#d090c0;--accent2:#f0c0e0;--foil:#e8b878}
[data-accent="emerald"]{--accent:#2e5a4a;--accent2:#1a3a2b;--accent3:#4d8970}
[data-accent="sapphire"]{--accent:#29417a;--accent2:#16254a;--accent3:#4a6ec0}
[data-accent="amber"]{--accent:#8a5a1a;--accent2:#5a3a0a;--accent3:#c0903a}
[data-accent="plum"]{--accent:#5a2a4a;--accent2:#3a1a2b;--accent3:#8a4a70}
[data-size="small"]{--fs:.9}[data-size="large"]{--fs:1.12}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:'Manrope',system-ui,sans-serif;color:var(--text);line-height:1.6;overflow-x:hidden;min-height:100vh;
  background:var(--bg1);
  background-image:
    radial-gradient(circle at 15% 15%,var(--mesh1) 0%,transparent 45%),
    radial-gradient(circle at 85% 10%,var(--mesh2) 0%,transparent 50%),
    radial-gradient(circle at 50% 85%,var(--mesh3) 0%,transparent 55%),
    radial-gradient(circle at 90% 90%,var(--mesh4) 0%,transparent 45%),
    linear-gradient(135deg,var(--bg1),var(--bg2) 50%,var(--bg3));
  font-size:calc(1rem * var(--fs));transition:color .3s
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--accent);opacity:.4;border-radius:4px}

/* TRAIL — disabled on touch */
.trail{position:fixed;width:70px;height:70px;border-radius:50%;pointer-events:none;z-index:1;
  background:radial-gradient(circle,var(--accent3) 0%,transparent 70%);opacity:.28;filter:blur(12px);
  transform:translate(-50%,-50%);will-change:transform}
[data-theme="dark"] .trail{opacity:.4}
@media (hover: none),(pointer: coarse){.trail{display:none!important}}

/* HEADER — единственный элемент с blur */
.hdr{position:sticky;top:0;z-index:100;padding:12px 18px;background:rgba(248,242,230,.88);border-bottom:1px solid var(--border);transition:padding .3s}
[data-theme="dark"] .hdr{background:rgba(20,14,20,.88)}
@supports (backdrop-filter:blur(12px)) or (-webkit-backdrop-filter:blur(12px)){
  .hdr{backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);background:rgba(248,242,230,.75)}
  [data-theme="dark"] .hdr{background:rgba(20,14,20,.75)}
}
.hdr.compact{padding:6px 18px}
.hdr.compact .logo-txt span{display:none}
.hdr-in{max-width:1400px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0}
.logo-ic{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--foil);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;box-shadow:0 4px 14px var(--accent);flex-shrink:0;border:1px solid rgba(255,255,255,.15);transition:transform .25s}
.logo:hover .logo-ic{transform:scale(1.06) rotate(-4deg)}
.logo-txt{min-width:0}.logo-txt h1{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo-txt span{font-size:10px;color:var(--text2)}
.hdr-act{display:flex;gap:6px;align-items:center}
.ibtn{width:38px;height:38px;border-radius:11px;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:15px;transition:transform .2s}
.ibtn:hover{transform:translateY(-2px);box-shadow:var(--shadow2)}
.ibtn.hidden{display:none}
.layout{max-width:1400px;margin:0 auto;padding:20px;position:relative;z-index:2}

/* HERO */
.hero{text-align:center;padding:26px 20px 20px;background:var(--card);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow);margin-bottom:16px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--accent),transparent)}
.hero .pill{display:inline-block;padding:5px 12px;border-radius:14px;background:var(--card2);color:var(--accent2);font-size:10px;font-weight:700;letter-spacing:.13em;margin-bottom:12px;border:1px solid var(--accent)}
.hero h1{font-family:'Cormorant Garamond',serif;font-size:40px;font-weight:700;line-height:1.05;margin-bottom:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero .sub{font-size:13px;color:var(--text2);max-width:500px;margin:0 auto;line-height:1.6}
.chips{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{padding:3px 10px;border-radius:10px;background:var(--card2);color:var(--accent2);font-size:11px;font-weight:600;border:1px solid var(--divider);cursor:pointer}
.chip:hover{background:var(--accent);color:#fff}

/* BOOK — GPU-accelerated 3D */
.book-stage{perspective:1400px;height:340px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:grab;touch-action:none;user-select:none;margin:16px 0 6px;position:relative}
.book-stage:active{cursor:grabbing}
.book3d{width:190px;height:265px;position:relative;transform-style:preserve-3d;transform:rotateY(-22deg) rotateX(8deg);transition:transform .06s ease-out}
.book3d.dragging{will-change:transform}
.book-cov{position:absolute;inset:0;background:linear-gradient(135deg,var(--accent) 0%,var(--accent2) 60%,var(--accent2) 100%);border-radius:5px 11px 11px 5px;box-shadow:0 18px 45px rgba(0,0,0,.28),0 36px 65px rgba(0,0,0,.18);overflow:hidden;display:flex;align-items:center;justify-content:center;padding:18px}
.book-cov::before{content:'';position:absolute;left:0;top:0;bottom:0;width:22px;background:linear-gradient(90deg,rgba(0,0,0,.6),rgba(0,0,0,.2) 45%,rgba(255,255,255,.08) 55%,rgba(0,0,0,.15));border-right:1px solid rgba(0,0,0,.4)}
.book-cov::after{content:'';position:absolute;top:3px;bottom:3px;right:-11px;width:11px;background:linear-gradient(90deg,#efe2c5 0%,#f8f0dc 30%,#e8d8b5 70%,#d8c8a0 100%);border-radius:0 4px 4px 0;box-shadow:4px 0 6px rgba(0,0,0,.3)}
.book-inner{margin-left:18px;text-align:center;color:var(--foil);position:relative;z-index:2;width:100%;padding:14px 6px}
.book-orn{font-size:10px;letter-spacing:.4em;opacity:.55;margin-bottom:12px}
.book-frame{border:1.5px solid var(--foil);border-radius:5px;padding:14px 6px;position:relative}
.book-frame::before,.book-frame::after{content:'';position:absolute;width:5px;height:5px;border:1.5px solid var(--foil);border-radius:50%;background:var(--accent2)}
.book-frame::before{top:-3px;left:-3px}.book-frame::after{bottom:-3px;right:-3px}
.book-title{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:700;letter-spacing:.12em;line-height:1.15;text-shadow:0 2px 3px rgba(0,0,0,.5)}
.book-line{display:flex;align-items:center;gap:6px;justify-content:center;margin:8px 0;color:var(--foil);opacity:.7;font-size:9px}
.book-line::before,.book-line::after{content:'';width:24px;height:1px;background:var(--foil);opacity:.6}
.book-sub{font-size:9px;letter-spacing:.25em;opacity:.9;font-weight:600}
.book-year{font-family:'Cormorant Garamond',serif;font-size:9px;letter-spacing:.4em;margin-top:10px;opacity:.55;font-style:italic}
.book-ribbon{position:absolute;top:-2px;right:32px;width:13px;height:55px;background:linear-gradient(180deg,#8b1a2b,#6a0f20);clip-path:polygon(0 0,100% 0,100% 100%,50% 85%,0 100%);box-shadow:2px 2px 4px rgba(0,0,0,.4);z-index:3}
.book-shine{position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.18) 46%,rgba(255,255,255,.05) 51%,transparent 58%);pointer-events:none;border-radius:inherit}
.book-hint{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.13em;margin-top:8px;opacity:.75;font-weight:600}

/* DRAWER */
.drawer-btn{display:flex;align-items:center;justify-content:center;gap:8px;margin:14px auto 0;padding:11px 22px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:700;font-size:13px;box-shadow:0 6px 20px var(--accent);transition:transform .2s;border:none}
.drawer-btn:hover{transform:translateY(-2px)}
.drawer{position:fixed;inset:0;z-index:150;pointer-events:none}
.drawer.open{pointer-events:auto}
.drawer::before{content:'';position:absolute;inset:0;background:rgba(20,10,15,.5);opacity:0;transition:opacity .3s}
.drawer.open::before{opacity:1}
.drawer-panel{position:absolute;top:0;left:0;right:0;max-height:80vh;background:var(--card);border-bottom-left-radius:22px;border-bottom-right-radius:22px;border-bottom:1px solid var(--border);transform:translateY(-100%);transition:transform .35s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.drawer.open .drawer-panel{transform:translateY(0)}
.drawer-head{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--divider);flex-wrap:wrap}
.drawer-head h3{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:700;color:var(--accent2)}
.drawer-search{flex:1;min-width:150px;padding:8px 14px;border-radius:10px;border:1.5px solid var(--divider);background:var(--card2);font-family:inherit;font-size:13px;color:var(--text)}
.drawer-search:focus{outline:none;border-color:var(--accent)}
.drawer-body{padding:14px 20px 20px;overflow-y:auto;flex:1}
.drawer-sec{margin-bottom:12px}
.drawer-sec h4{font-family:'Cormorant Garamond',serif;font-size:15px;font-weight:700;color:var(--accent2);margin-bottom:6px}
.drawer-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px}
.drawer-item{padding:8px 12px;border-radius:10px;background:var(--card2);border:1px solid var(--divider);cursor:pointer;font-size:12px;font-weight:600;text-align:left;transition:transform .15s;color:var(--text)}
.drawer-item:hover{background:var(--card);border-color:var(--accent);transform:translateX(2px)}

/* PALETTE */
.palette{position:fixed;inset:0;z-index:160;display:none;align-items:flex-start;justify-content:center;padding:80px 20px 20px;background:rgba(20,10,15,.5)}
.palette.show{display:flex}
.palette-box{width:100%;max-width:520px;background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden}
.palette-input{width:100%;padding:16px 20px;border:none;background:transparent;font-family:inherit;font-size:16px;color:var(--text);border-bottom:1px solid var(--divider);font-weight:600}
.palette-input:focus{outline:none}
.palette-results{max-height:50vh;overflow-y:auto}
.palette-item{padding:10px 18px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--divider);display:flex;align-items:center;gap:10px}
.palette-item:hover{background:var(--card2)}
.palette-item .pi-tag{font-size:9px;padding:1px 6px;border-radius:4px;background:var(--accent);color:#fff;font-weight:700;text-transform:uppercase;letter-spacing:.05em}

/* PROGRESS */
.prog{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 18px;box-shadow:var(--shadow);margin-bottom:12px}
.prog-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:6px}
.prog-h b{font-size:12px}.prog-h .pct{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;color:var(--accent2)}
.prog-bar{height:8px;background:var(--divider);border-radius:4px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:4px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.prog-sub{font-size:10px;color:var(--text3);margin-top:5px}

.recent{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 16px;box-shadow:var(--shadow);margin-bottom:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.recent .lbl{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em}
.recent-chip{padding:5px 10px;border-radius:8px;background:var(--card2);border:1px solid var(--divider);font-size:11px;font-weight:600;color:var(--text2);cursor:pointer;transition:background .2s}
.recent-chip:hover{background:var(--accent);color:#fff;border-color:var(--accent)}

/* SECTIONS — без opacity:0, без IntersectionObserver */
.sec{margin-bottom:22px}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding-left:4px;cursor:pointer;user-select:none}
.sec-ic{font-size:18px;width:36px;height:36px;border-radius:10px;background:var(--card2);display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid var(--divider)}
.sec-t{flex:1;min-width:0}
.sec-t h3{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:700;line-height:1.2}
.sec-t .cnt{font-size:10px;color:var(--text3);font-weight:600}
.sec-tog{width:26px;height:26px;border-radius:8px;background:var(--card2);color:var(--accent2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;border:1px solid var(--divider);transition:background .2s}
.sec-h:hover .sec-tog{background:var(--accent);color:#fff}
.sec-tog .arrow{display:inline-block;transition:transform .3s}
.sec.collapsed .sec-tog .arrow{transform:rotate(-90deg)}
.sec.collapsed .sec-strip{display:none}
.sec-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;animation:cardsIn .35s ease}
@keyframes cardsIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:1100px){.sec-strip{grid-template-columns:repeat(4,1fr)}}
@media(max-width:850px){.sec-strip{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){.sec-strip{grid-template-columns:repeat(2,1fr)}}

.pcard{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px;box-shadow:var(--shadow);cursor:pointer;transition:transform .2s,box-shadow .2s;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:6px;min-height:180px}
.pcard:hover{transform:translateY(-3px);box-shadow:var(--shadow2);border-color:var(--accent)}
.pcard-img{height:66px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:32px;background:linear-gradient(135deg,var(--card2),var(--card));border:1px solid var(--divider);overflow:hidden}
.pcard-img svg{width:100%;height:100%}
.pcard-t{font-size:12px;font-weight:700;line-height:1.3;flex:1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.pcard-m{font-size:9px;color:var(--text3);font-weight:600}
.pcard-star{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:7px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text3);transition:transform .15s,background .15s;cursor:pointer;z-index:2}
.pcard-star:hover{background:var(--accent);color:#fff}
.pcard-star.on{color:var(--foil);background:rgba(232,201,135,.2)}

/* PARAGRAPH */
.breadcrumbs{font-size:11px;color:var(--text3);margin-bottom:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.breadcrumbs a{color:var(--text2);cursor:pointer}
.breadcrumbs a:hover{color:var(--accent)}
.breadcrumbs .sep{opacity:.5}
.phero{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:16px 20px;box-shadow:var(--shadow);margin-bottom:12px;display:flex;gap:14px;align-items:center;position:relative}
.phero-ic{font-size:28px;width:54px;height:54px;border-radius:14px;background:var(--card2);display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid var(--divider)}
.phero-info{flex:1;min-width:0}
.phero-info h2{font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:700;line-height:1.2;margin-bottom:3px;padding-right:120px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.phero-meta{font-size:11px;color:var(--text2);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.phero-meta .dot{width:3px;height:3px;border-radius:50%;background:var(--text3)}
.phero-nav{position:absolute;top:12px;right:12px;display:flex;gap:4px}
.pnav{width:32px;height:32px;border-radius:9px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:13px;border:1px solid var(--divider);transition:background .15s}
.pnav:hover:not(:disabled){background:var(--accent);color:#fff}
.pnav:disabled{opacity:.3;cursor:not-allowed}
.pnav.star.on{color:var(--foil);background:rgba(232,201,135,.2);border-color:var(--foil)}

.tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:4px;box-shadow:var(--shadow)}
.tb{flex:1;min-width:65px;padding:8px 8px;border-radius:10px;font-size:11.5px;font-weight:600;color:var(--text2);transition:background .2s,color .2s}
.tb:hover{color:var(--text);background:var(--card2)}
.tb.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 3px 12px var(--accent)}

.pane{animation:slideIn .3s cubic-bezier(.4,0,.2,1);content-visibility:auto;contain-intrinsic-size:500px}
@keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.diagram{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px;text-align:center}
.diagram svg{max-width:100%;height:auto;max-height:260px;display:block;margin:0 auto}

.slist{list-style:none;counter-reset:s}
.slist li{counter-increment:s;position:relative;padding:11px 14px 11px 44px;margin-bottom:7px;border-radius:12px;background:var(--card);border:1px solid var(--border);font-size:13.5px;line-height:1.6;box-shadow:0 2px 8px rgba(90,50,50,.04)}
.slist li::before{content:counter(s);position:absolute;left:11px;top:10px;width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}

var DATA=[
{id:0,title:"Введение",emoji:"📖",dia:"comm",
summary:["Курс продолжает разговор о человеке, обществе и государстве, начатый в 9 классе.","Главная задача — понять современное общество: какие изменения в нём происходят.","Науки об обществе: социология, политология, экономика, культурология, философия.","Мир меняется: нужно включаться в преобразование, использовать технологии, строить IT-общество.","Учебник: инфографика → параграф → вопросы → обобщение.","Рубрики: «Персона в науке», «Поиск», «Обсуждаем и дискутируем», «Решаем задачу», мини-проекты.","Для повышенного уровня — электронное приложение на profil.adu.by."],
detailed:[{title:"Что изучает обществоведение",text:"Обществоведение — это интегративный курс, который объединяет знания нескольких социальных и гуманитарных наук: социологии, политологии, экономики, культурологии, философии и права. Каждая рассматривает общество под своим углом: социология — структуру и взаимодействие групп, политология — власть и государство, экономика — производство и распределение, культурология — ценности, философия — фундаментальные вопросы бытия. Вместе они дают объёмную картину общественной жизни."},{title:"Зачем это нужно в 10 классе",text:"К 10 классу вы уже понимаете себя и ближайшее окружение. Теперь следующий уровень: понять общество в целом — почему люди объединяются в группы, как возникают конфликты, откуда берутся законы, как формируется экономика. Эти знания нужны не только на экзамене, но и в повседневной жизни: понимать новости, осознанно голосовать, отстаивать права, не поддаваться манипуляциям."},{title:"Как устроен учебник",text:"Учебник построен по принципу от общего к частному. Каждый раздел начинается со схемы с целями. Затем идёт параграф с основным содержанием. После — вопросы для самоконтроля. В конце раздела — обобщение. Дополнительно: рубрики «Персона в науке» (об учёных), «Поиск» (задания на поиск информации), «Обсуждаем и дискутируем» (спорные вопросы), «Решаем задачу» (практические кейсы) и мини-проекты."}],
keyPoints:["Обществоведение объединяет социологию, политологию, экономику, культурологию и философию.","Главная задача — понять современное общество и его изменения.","Учебник: схема → параграф → вопросы → обобщение.","Рубрики делают обучение практико-ориентированным.","Приложение на profil.adu.by — для повышенного уровня."],

{id:1,title:"§ 1. Общество как система",emoji:"🌐",dia:"spheres",
summary:["Общество — исторически сложившаяся устойчивая система отношений между людьми.","Социология — наука о структуре и развитии общества. Термин ввёл Огюст Конт.","Социальное действие — осознанное действие, ориентированное на других (Макс Вебер).","Социальное взаимодействие — обмен действиями; повторяющиеся → социальные отношения.","Сферы жизни: социальная, экономическая, политическая, духовная.","Социальный институт — форма организации совместной жизнедеятельности.","Социальная общность — совокупность людей по признаку.","Социальная группа — устойчивая общность с общим интересом.","Молодёжь — 14–31 год по законодательству РБ."],
detailed:[{title:"Что такое общество",text:"Общество — это не просто сумма людей. Это исторически сложившаяся устойчивая система отношений между ними, которая воспроизводится из поколения в поколение. Люди вступают в отношения не по желанию, а потому что так устроена их совместная жизнь: чтобы выжить, производить блага, воспитывать детей, защищаться от врагов. Именно эти устойчивые связи и образуют общество как систему."},{title:"Почему социология — отдельная наука",text:"Люди размышляли об обществе с древности — в мифах, религии, философии. Но только в XIX веке Огюст Конт предложил рассматривать общество как объект строгой науки — социологии. Он считал, что общество развивается по определённым законам, которые можно изучать как законы природы. Сегодня социология — наука о структуре, функциях и развитии общества как социальной системы."},{title:"Социальное действие и взаимодействие",text:"Макс Вебер ввёл понятие «социальное действие» — действие, которое человек осознаёт и ориентирует на поведение других людей. Например, уступить место в транспорте, придержать дверь, поздороваться — всё это социальные действия. Когда действия людей направлены друг на друга и повторяются, возникает социальное взаимодействие. А если оно становится устойчивым — социальные отношения."},{title:"Сферы и институты общества",text:"Общество делится на четыре сферы: социальную (отношения между группами), экономическую (производство и распределение), политическую (власть и управление) и духовную (культура, наука, религия). Эти сферы не существуют отдельно — это разные стороны жизни одних и тех же людей. В каждой сфере формируются социальные институты — семья, государство, школа, производство, религия. Они упорядочивают отношения и делают общество устойчивым."},{title:"Социальные общности и группы",text:"Люди объединяются в общности по разным признакам: возраст, профессия, национальность, место жительства. Общность — это совокупность людей, объединённых каким-то признаком. Если внутри общности есть устойчивое взаимодействие, общий интерес, разделяемые ожидания и обособленность — это уже социальная группа. Молодёжь — особая социально-демографическая группа (14–31 год по закону РБ), проходящая стадию социализации."}],
keyPoints:["Общество — устойчивая система отношений между людьми, а не случайная сумма.","Огюст Конт — основатель социологии (XIX век).","Социальное действие — осознанное и ориентированное на других (по Веберу).","4 сферы общества: социальная, экономическая, политическая, духовная.","Социальные институты: семья, государство, школа, производство, религия.","Молодёжь в Беларуси — 14–31 год.","Повторяющиеся взаимодействия → устойчивые социальные отношения."],

{id:2,title:"§ 2. Социальная структура общества",emoji:"🏛️",dia:"pyramid",
summary:["Социальная структура — распределение групп и связи между ними.","Горизонтальная: демографические, этнические, конфессиональные, поселенческие, профессиональные.","Вертикальная: классы и страты по доходу, власти, образованию, престижу.","Классы — большие группы по месту в производстве.","К. Маркс: классовые интересы противоположны.","Средний класс — гарант стабильности.","Страты — критерии П. Сорокина: доход, власть, профессия."],
detailed:[{title:"Что такое социальная структура",text:"Социальная структура — это то, как общество «разложено по полочкам». Одни люди входят в разные группы по возрасту, полу, профессии, национальности, религии, доходу. Другие различаются по положению на «социальной лестнице». Социальная структура показывает, кто с кем связан, кто на каком уровне и почему. Это не застывшая картина — люди постоянно перемещаются между группами."},{title:"Горизонтальная структура",text:"Горизонтальная структура — деление на группы по объективным признакам, без оценки «выше-ниже». Основные виды: демографические (мужчины/женщины, дети/взрослые), этнические (белорусы, русские, поляки), конфессиональные (православные, католики, мусульмане), поселенческие (город/село), профессиональные (врачи, учителя). Эти группы не выстроены в иерархию — они просто разные."},{title:"Вертикальная структура",text:"Вертикальная структура — иерархия, где группы стоят «выше» или «ниже». Главные критерии: доход (сколько зарабатываешь), власть (сколько людей подчиняются), образование (какой уровень), престиж (как общество оценивает профессию). По этим критериям людей делят на классы (высший, средний, низший) и страты (слои). Чем больше людей в среднем классе — тем стабильнее общество."}],
keyPoints:["Социальная структура — деление общества на группы и связи между ними.","Горизонтальная: демографическая, этническая, конфессиональная, поселенческая, профессиональная.","Вертикальная: классы и страты по доходу, власти, образованию, престижу.","Маркс: классовые интересы противоположны.","Средний класс — гарант стабильности.","Сорокин выделил 3 критерия страты: доход, власть, профессия."],
test:[{q:"Что определяет социальную структуру?",o:["Численность","Распределение групп и связи","Только экономика","Только политика"],c:1},{q:"Группы в горизонтальной структуре:",o:["Только классы","Демографические, этнические, конфессиональные","Только страты","Только элиты"],c:1},{q:"Кто исследовал противоречия между классами?",o:["Конт","Маркс","Вебер","Сорокин"],c:1},{q:"Большая часть в развитых странах — класс:",o:["Высший","Средний","Низший","Маргинальный"],c:1},{q:"Критерии страты по Сорокину:",o:["Доход, власть, профессия","Пол, возраст, национальность","Религия, язык, территория","Образование, хобби, семья"],c:0},{q:"Что такое престиж?",o:["Доход","Оценка профессии в обществе","Власть","Образование"],c:1},{q:"Какие группы выделяют по месту жительства?",o:["Этнические","Поселенческие","Профессиональные","Религиозные"],c:1},{q:"Что такое класс по Марксу?",o:["Группа по доходу","Группа по месту в производстве","Группа по хобби","Группа по возрасту"],c:1},{q:"Что характерно для среднего класса?",o:["Бедность","Устойчивые доходы","Крупный капитал","Отсутствие жилья"],c:1},{q:"Какой признак отличает страту от класса?",o:["Учитывает престиж","Только доход","Только власть","Только профессия"],c:0}],
questions:[{q:"По каким критериям описывают структуру?",a:"Горизонтальная — демографический, этнический; вертикальная — доход, власть, образование, престиж."},{q:"Структура в виде Эйфелевой башни.",a:"Внизу — низший класс, в середине — средний, наверху — высший."},{q:"К какому классу относятся персонажи?",a:"В простой одежде — низший; в костюмах — средний; богато одетые — высший."}],

{id:3,title:"§ 3. Статусы, роли и мобильность",emoji:"🎭",dia:"roles",
summary:["Статус — положение с правами и обязанностями.","Виды: предписанный, приобретённый, смешанный, главный.","Роль — образец поведения для статуса.","Ролевое ожидание и ролевое исполнение.","Ролевой конфликт — несовместимые требования.","Мобильность — изменение позиции (Сорокин).","Виды: вертикальная/горизонтальная; индивидуальная/групповая.","Каналы: армия, религия, образование, политика, искусство, СМИ, семья."],
detailed:[{title:"Социальный статус",text:"Социальный статус — это позиция человека в обществе, с которой связаны определённые права и обязанности. Например, статус студента даёт право на льготы, но накладывает обязанность учиться. Статусы бывают: предписанный (пол, возраст, национальность — получен автоматически), приобретённый (профессия, образование — благодаря усилиям), смешанный (например, безработный в результате кризиса) и главный (тот, который считают основным — чаще профессиональный)."},{title:"Социальная роль",text:"Социальная роль — образец поведения, ожидаемый от человека с определённым статусом. Когда мы знаем статус человека (учитель, мать, депутат), мы автоматически ожидаем определённых действий. Ролевое ожидание — модель поведения, которую предполагают окружающие. Ролевое исполнение — то, как человек фактически себя ведёт. Если ожидания и исполнение не совпадают — возникают санкции (от порицания до увольнения). А если требования разных ролей противоречат — это ролевой конфликт."},{title:"Социальная мобильность",text:"Социальная мобильность — изменение позиции человека или группы в социальной структуре. Понятие ввёл Питирим Сорокин. Мобильность бывает вертикальной (вверх или вниз — повышение в должности, разорение) и горизонтальной (перемещение на том же уровне — переход на другую работу, переезд). Также различают индивидуальную (перемещается один) и групповую (перемещаются целые классы — после революции). Каналы мобильности — «социальные лифты»: армия, церковь, образование, политика, искусство, СМИ, собственность, семья и брак."}],
keyPoints:["Статус — позиция с правами и обязанностями. Роль — образец поведения для статуса.","Статусы: предписанный, приобретённый, смешанный, главный.","Мобильность — изменение позиции (Сорокин). Вертикальная — вверх/вниз, горизонтальная — на том же уровне.","Мобильность: индивидуальная (один) и групповая (классы).","Каналы — «социальные лифты»: армия, церковь, образование, политика, брак.","Ролевой конфликт — требования разных ролей противоречат."],

questions:[{q:"Виды статусов на своём примере.",a:"Предписанный: сын, белорус. Приобретённый: школьник. Смешанный: безработный. Главный: профессия."},{q:"Санкции за несоответствие роли.",a:"Увольнение, порицание, штраф."},{q:"Четыре вида мобильности.",a:"Личная горизонтальная, групповая горизонтальная, личная вертикальная, групповая вертикальная."}],

{id:4,title:"§ 4. Социальная коммуникация",emoji:"💬",dia:"comm",
summary:["Коммуникация — процесс передачи информации между субъектами.","Модель: кто? что? как? кому? с каким эффектом?","Виды по субъектам: межличностная, межгрупповая, массовая.","По контакту: непосредственная и опосредованная.","По трансляции: вербальная и невербальная.","СМИ — «четвёртая власть».","Правила новостей: 5W+H.","Медиакультура — культура с массовой коммуникацией."],
detailed:[{title:"Что такое коммуникация",text:"Коммуникация — процесс взаимодействия между людьми, группами или организациями с целью передачи информации или обмена ею. Модель коммуникации включает 5 элементов: кто передаёт (коммуникатор), что (сообщение), как (канал), кому (аудитория) и с каким эффектом. Также важны внутренние составляющие: мотивация участников, общие знаковые системы (язык, жесты) и понимание контекста. Одно и то же сообщение может значить разное в разных контекстах."},{title:"Виды коммуникации",text:"По субъектам: межличностная (два человека), межгрупповая (между группами), массовая (на большие аудитории через технические средства). По способу контакта: непосредственная (лицом к лицу) и опосредованная (через телефон, интернет). По способу трансляции: вербальная (речь, письмо) и невербальная (жесты, мимика, позы, интонация). В реальной жизни все эти виды переплетаются."},{title:"СМИ и медиакультура",text:"СМИ — средства массовой коммуникации: газеты, журналы, телевидение, радио, интернет-издания. Их называют «четвёртой властью», потому что они контролируют деятельность государства через огласку и формируют общественное мнение. Теория повестки дня: СМИ влияют на общество не только содержанием, но и подбором того, что освещать. Медиакультура — культура современного общества, неотделимая от массовой коммуникации."}],
keyPoints:["Коммуникация — процесс передачи информации между субъектами.","Модель: кто? что? как? кому? с каким эффектом?","Виды: межличностная, межгрупповая, массовая; вербальная и невербальная.","СМИ — «четвёртая власть», контролируют власть и формируют мнение.","Правила новостей — 5W+H.","Медиакультура — культура с массовой коммуникацией."],

{id:5,title:"§ 5. Социальные процессы",emoji:"🔄",dia:"",
summary:["Социальный процесс — повторяющиеся действия, меняющие ситуацию.","Свойства: массовость, целенаправленность, повторяемость, устойчивость.","Эволюция — постепенные изменения; революция — резкий скачок.","Реформа — продуманные изменения отдельных сфер.","Толпа — скопление, спонтанно реагирующее.","Публика — собрание со схожими ожиданиями.","Массовое поведение — однотипные формы поведения.","Социальные движения — действия за/против изменений."],
detailed:[{title:"Социальные процессы",text:"Социальный процесс — однонаправленные и повторяющиеся социальные действия, которые сохраняют или изменяют ситуацию. Например, урбанизация, миграция, инфляция — всё это процессы. Чтобы явление считалось процессом, оно должно быть массовым, целенаправленным, повторяемым и устойчивым. Эволюция — постепенные изменения. Революция — резкий скачок к качественно новому состоянию. Реформа — продуманное изменение отдельных сфер."},{title:"Толпа и публика",text:"Толпа — временное скопление людей, которые при физическом контакте спонтанно реагируют на один раздражитель. Свойства толпы: нет организационных норм, подражательность, деиндивидуализация, утрата личной ответственности. Публика — собрание людей со схожими ожиданиями (зрители в кино, посетители выставки). Публика может перейти в толпу при сильном раздражителе (пожар, взрыв, слух об опасности)."},{title:"Массовое поведение и движения",text:"Массовое поведение — однотипные формы поведения большого числа людей в ответ на значимый раздражитель. Особенности: совпадение стратегий, анонимность, неорганизованность. Социальные движения — массовые действия, способствующие или препятствующие социальным изменениям. Они нестабильны, имеют стадии развития, могут быть прогрессивными или регрессивными. Достигнув цели, движение часто превращается в социальный институт."}],
keyPoints:["Социальный процесс — массовые, повторяющиеся, устойчивые действия.","Эволюция — постепенно, революция — резко, реформа — продуманно.","Толпа — спонтанна и подражательна, публика — со схожими ожиданиями.","Публика может превратиться в толпу при раздражителе.","Массовое поведение — однотипные формы поведения.","Социальные движения — действия за/против изменений."],
test:[{q:"Социальный процесс — это:",o:["Одно действие","Повторяющиеся действия","Революция","Реформа"],c:1},{q:"Эволюция vs революция:",o:["Эволюция быстрее","Постепенные vs резкий скачок","Революция не меняет","Эволюция насильственна"],c:1},{q:"Толпа — это:",o:["Организованная","Скопление людей","Партия","Институт"],c:1},{q:"Публика отличается тем, что:",o:["Агрессивна","Со схожими ожиданиями","Не переходит в толпу","= толпа"],c:1},{q:"Что НЕ свойство толпы?",o:["Отсутствие норм","Подражательность","Деиндивидуализация","Организация"],c:3},{q:"youthquake — это:",o:["Землетрясение","Изменение от действий молодёжи","Партия","Праздник"],c:1},{q:"Что относится к свойствам толпы?",o:["Организация","Подражательность","Дисциплина","Порядок"],c:1},{q:"Что такое реформа?",o:["Резкий скачок","Продуманные изменения","Стихийное бедствие","Война"],c:1},{q:"Какое движение создаёт идеальные общества?",o:["Утопическое","Экологическое","Феминистское","Пацифистское"],c:0},{q:"Что такое youthquake?",o:["Землетрясение","Значимое изменение от молодёжи","Праздник","Партия"],c:1}],

{id:6,title:"§ 6. Политика",emoji:"🗳️",dia:"",
summary:["Политика — сфера отношений за власть и её осуществление.","Понятие ввёл Аристотель.","Власть — способность осуществлять волю. Признак — подчинение.","Субъекты власти — носители.","Элита — группа с реальной властью.","Лидер — личность с влиянием.","Типы лидерства: традиционное, легальное, харизматическое.","Политическая система — институты, идеи, нормы."],
detailed:[{title:"Что такое политика",text:"Политика — сфера общественных отношений и деятельность, направленная на завоевание государственной власти и её осуществление. Понятие ввёл Аристотель. В политике участвуют разные субъекты: государство, партии, элиты, лидеры, граждане. Политика — это не только борьба за власть, но и организация управления обществом, принятие решений, разрешение конфликтов. В современном обществе политика пронизывает все сферы жизни."},{title:"Власть и её признаки",text:"Власть — способность и возможность одного человека или группы осуществлять свою волю, влиять на поведение других. Важнейший признак власти — подчинение: без него власти нет. Субъекты власти — те, кто её осуществляет (носители). Объекты власти — те, на кого она направлена. Власть бывает в семье, в коллективе, в государстве. Политическая власть опирается на систему учреждений, законов и может применять принуждение."},{title:"Элиты и лидеры",text:"Политическая элита — группа, обладающая реальной политической властью, возможностью воздействовать на общество. Элита отличается сплочённостью, опытом, способностями к управлению. Политический лидер — личность, оказывающая постоянное и доминирующее влияние на общество. Типы лидерства: по источнику власти — традиционное (по обычаю), легальное (по закону), харизматическое (по вере в качества); по целям — консерватор, реформатор, революционер; по имиджу — знаменосец, служитель, торговец, пожарный."}],
keyPoints:["Политика — сфера за власть и её осуществление. Понятие ввёл Аристотель.","Власть — способность осуществлять волю. Признак — подчинение.","Субъекты власти — носители.","Политическая элита — группа с реальной властью.","Типы лидерства: традиционное, легальное, харизматическое.","Политическая система — институты, идеи, нормы."],

{id:7,title:"§ 7. Государство",emoji:"🏰",dia:"state",
summary:["Государство — форма организации власти с аппаратом управления.","Признаки: территория, население, власть, право, суверенитет.","Монопольные права: законы, принуждение, налоги.","Функции: внутренние и внешние.","Форма = правление + устройство + режим.","Правление: монархия, республика.","Устройство: унитарное, федерация, конфедерация.","Режимы: демократический, авторитарный, тоталитарный.","Беларусь — унитарное демократическое социальное правовое государство."],
detailed:[{title:"Что такое государство",text:"Государство — особая форма организации политической власти, которая располагает специальным аппаратом управления обществом. Основные признаки: территория, население, публичная власть, право, суверенитет. Монопольные права государства: издавать общеобязательные законы, применять принуждение, взимать налоги. Никакая другая организация в стране не имеет этих прав."},{title:"Функции государства",text:"Внутренние функции: правоохранительная, социальная, экономическая, культурная. Внешние: оборона страны, дипломатия и международное сотрудничество, участие в решении глобальных проблем. Функции государства не остаются неизменными — они трансформируются вместе с обществом."},{title:"Форма государства",text:"Форма государства состоит из трёх элементов: форма правления, форма территориального устройства и политический режим. Форма правления: монархия (абсолютная, конституционная) и республика (президентская, парламентская, смешанная). Территориальное устройство: унитарное (единое), федерация (союз субъектов), конфедерация (союз государств). Политический режим: демократический, авторитарный, тоталитарный. Беларусь по Конституции — унитарное демократическое социальное правовое государство."}],
keyPoints:["Государство — форма организации власти с аппаратом управления.","Признаки: территория, население, власть, право, суверенитет.","Монопольные права: законы, принуждение, налоги.","Форма = правление + устройство + режим.","Правления: монархия, республика. Устройства: унитарное, федерация, конфедерация.","Режимы: демократический, авторитарный, тоталитарный.","Беларусь — унитарное демократическое социальное правовое государство (ст. 1)."],

{id:8,title:"§ 8. Демократия",emoji:"⚖️",dia:"",
summary:["Демократия — политическая система, при которой власть у народа.","Линкольн: правление народа, посредством народа и для народа.","Формы: прямая и представительная.","Избирательное право: активное и пассивное.","Принципы выборов: всеобщие, свободные, равные, прямые, тайные.","Системы: мажоритарная, пропорциональная, смешанная.","Принципы демократии: суверенитет, выборы, разделение властей, плюрализм.","Парламент — высший выборный и законодательный орган."],
detailed:[{title:"Что такое демократия",text:"Демократия (от греч. «народовластие») — политическая система, при которой власть осуществляется народом. Линкольн дал классическое определение: «правление народа, посредством народа и для народа». Демократия предполагает, что источник власти — народ, который сам принимает решения (прямая демократия) или выбирает представителей (представительная). Принципы: суверенитет народа, свободные выборы, разделение властей, плюрализм, контроль общества за властью."},{title:"Формы демократии",text:"Прямая демократия: граждане сами принимают решения — через выборы, референдумы, обсуждения проектов законов, сходы и собрания, обращения в органы власти. Представительная: народ выбирает представителей (парламент, президент, местные советы), которые принимают решения от его имени. В современном обществе преобладает представительная демократия, но прямая сохраняет значение — особенно с развитием электронных сервисов (e-gov.by)."},{title:"Избирательное право",text:"Избирательное право — совокупность норм, регулирующих участие граждан в выборах. Активное — право избирать. Пассивное — право быть избранным. Принципы выборов: всеобщие, свободные, равные, прямые и тайные. Избирательные системы: мажоритарная (по большинству), пропорциональная (по партийным спискам), смешанная."}],
keyPoints:["Демократия — власть народа. Определение Линкольна.","Формы: прямая (референдумы) и представительная (парламент).","Активное право — избирать, пассивное — быть избранным.","Принципы выборов: всеобщие, свободные, равные, прямые, тайные.","Системы: мажоритарная, пропорциональная, смешанная.","Принципы демократии: суверенитет, выборы, разделение властей, плюрализм."],

{id:9,title:"§ 9. Правовое государство",emoji:"📜",dia:"",
summary:["Правовое государство — на основе верховенства права, разделения властей, прав человека.","Принципы: верховенство права, разделение, взаимная ответственность.","Хартия вольностей (1215), Статут ВКЛ (1588), Локк.","Права человека — в основе закона.","Гражданское общество — сфера независимых институтов.","Институты: партии, профсоюзы, церковь, СМИ, фонды.","СМИ — «четвёртая власть».","Государство и общество не могут друг без друга."],
detailed:[{title:"Идея правового государства",text:"Правовое государство — форма организации политической власти, основанная на верховенстве права, разделении властей и соблюдении прав человека. Идея развивалась веками: Великая хартия вольностей (1215), Статут ВКЛ (1588), теории Локка и Монтескьё. Главный принцип: не закон лежит в основе прав людей, а права человека — в основе закона. Цель государства — обеспечение прав и недопущение нарушения свободы."},{title:"Принципы правового государства",text:"Три главных принципа. Первый — верховенство права: все равны перед законом и судом, права и свободы реально защищены. Второй — разделение властей на законодательную, исполнительную и судебную с системой «сдержек и противовесов». Третий — взаимная ответственность государства и личности: граждане отвечают за выполнение обязанностей, а государство — перед гражданами за свои действия."},{title:"Гражданское общество и СМИ",text:"Гражданское общество — сфера самостоятельных и относительно независимых от государства институтов. Важнейшие институты: партии, общественные организации и движения, профсоюзы, церковь, СМИ, фонды. СМИ — «четвёртая власть»: контролируют деятельность государства через огласку, формируют общественное мнение. Теория повестки дня: СМИ влияют подбором новостей. Без развитого гражданского общества правовое государство невозможно."}],
keyPoints:["Правовое государство — верховенство права, разделение властей, права человека.","Принципы: верховенство права, разделение властей, взаимная ответственность.","«Не закон в основе прав, а права — в основе закона».","Гражданское общество — независимые от государства институты.","Институты: партии, профсоюзы, церковь, СМИ, фонды.","СМИ — «четвёртая власть».","Государство и гражданское общество не могут друг без друга."],
test:[{q:"Правовое государство:",o:["Без законов","На основе верховенства права","С монархом","Без общества"],c:1},{q:"Что НЕ принцип?",o:["Верховенство права","Разделение","Взаимная ответственность","Единая идеология"],c:3},{q:"Документ 1215 г.:",o:["Статут ВКЛ","Великая хартия","Конституция США","Декларация"],c:1},{q:"Гражданское общество:",o:["Госорганы","Независимые институты","Армия","Парламент"],c:1},{q:"Что НЕ институт?",o:["Партии","Профсоюзы","Церковь","Правительство"],c:3},{q:"СМИ — «четвёртая власть» потому что:",o:["Издают законы","Контролируют власть","Судят","Управляют"],c:1},{q:"Что такое правовое государство?",o:["Без законов","На основе верховенства права","С монархом","Без общества"],c:1},{q:"Что относится к принципам правового государства?",o:["Единая идеология","Разделение властей","Запрет выборов","Цензура"],c:1},{q:"Что такое гражданское общество?",o:["Госорганы","Независимые институты","Армия","Парламент"],c:1},{q:"Какая теория про СМИ?",o:["Теория повестки дня","Теория стоимости","Теория игр","Теория классов"],c:0}],

{id:10,title:"§ 10. Идеологии",emoji:"💭",dia:"",
summary:["Идеология — идеи и ценности, отражающие интересы слоёв.","Термин ввёл Дестют де Траси в XVIII в.","Уровни: теоретический, программно-политический, обыденный.","Основные: либерализм, консерватизм, социализм.","Либерализм: свобода, права, частная собственность.","Консерватизм: традиции, стабильность.","Социализм: коллективизм, справедливость.","Правые и левые. Радикализм — быстрое изменение."],
detailed:[{title:"Что такое идеология",text:"Политическая идеология — совокупность идей, идеалов и ценностей, в которых отражаются интересы определённых социальных слоёв, стремящихся реализовать их с помощью государственной власти. Термин ввёл Дестют де Траси в конце XVIII в. Идеология работает на трёх уровнях: теоретическом, программно-политическом (программы партий, лозунги) и обыденном (убеждения людей)."},{title:"Три суперидеологии",text:"Либерализм (от лат. liberalis — свободный) возник в XVII–XVIII вв. Ставит в центр свободу личности, права человека, частную собственность и рыночную экономику. Консерватизм (от лат. conservo — сохраняю) возник в конце XVIII в. как реакция на революции. Ценит традиции, стабильность, сильное государство. Социализм (от лат. socialis — общественный) возник в начале XIX в. как идеология рабочего класса. Проповедует коллективизм, социальную справедливость, равенство."},{title:"Правые, левые, радикалы",text:"Традиционно идеологии делят на правые и левые. Левые (социализм, социал-демократия, коммунизм) — за социальное равенство. Правые (либерализм, консерватизм, национализм) — за индивидуализм, свободу, частную собственность. Крайние формы — радикализм (от лат. radicalis — коренной): ориентация на коренное быстрое изменение общества, часто насильственным путём. В Беларуси запрещены фашизм, расизм, религиозный экстремизм, шовинизм."}],
keyPoints:["Идеология — идеи и ценности, отражающие интересы слоёв.","Термин ввёл Дестют де Траси. 3 уровня: теоретический, программный, обыденный.","Либерализм: свобода, права, собственность. Консерватизм: традиции, стабильность. Социализм: коллективизм, справедливость.","Правые — индивидуализм, левые — равенство.","Радикализм — коренное быстрое изменение.","Запрещены в РБ: фашизм, расизм, экстремизм, шовинизм."],

{id:11,title:"§ 11. Партии и объединения",emoji:"🚩",dia:"",
summary:["Общественное объединение — добровольное по интересам.","Виды: партии, организации, движения.","Партия — группа с идеологией, стремящаяся к власти.","Признаки: идеология, структура, установка на власть.","Функции: политическая, представительство, идеологическая, воспитательная.","Типы: по строю, членству, месту, центру.","Системы: одно-, двух-, многопартийная.","Организация — фиксированное членство; движение — массовое."],
detailed:[{title:"Общественные объединения",text:"Общественное объединение — добровольное объединение граждан на основе общности интересов. Виды: политические партии, общественные организации, общественные движения. Партия — организованная группа с общими политическими взглядами, стремящаяся к завоеванию власти. Организация — добровольное объединение с фиксированным членством, не претендующее на власть (профсоюз). Движение — массовая деятельность без чёткой структуры (экологическое, женское)."},{title:"Партии: признаки и функции",text:"Признаки партии: наличие идеологии и программы, организационная структура, установка на завоевание власти. Функции: политическая, представительство интересов, идеологическая, воспитательная. Партии делятся по отношению к строю (консервативные, революционные, реформистские), по членству (массовые, кадровые), по месту в системе власти (правящие, оппозиционные), по отношению к центру (левые, центристские, правые)."},{title:"Партийные системы",text:"Партийная система — совокупность партий, взаимодействующих в борьбе за власть. Однопартийная — только одна (плюс: концентрация ресурсов; минус: застой). Двухпартийная — две крупные партии сменяют друг друга (плюс: стабильность; минус: ограниченный выбор). Многопартийная — несколько партий (плюс: отражение интересов; минус: нестабильность). В Республике Беларусь действует многопартийность."}],
keyPoints:["Общественное объединение — добровольное по интересам.","Партия: идеология, структура, установка на власть.","Функции: политическая, представительство, идеологическая, воспитательная.","Партии: массовые/кадровые, правящие/оппозиционные, левые/правые.","Партийные системы: одно-, двух-, многопартийная.","Организация — фиксированное членство, движение — массовое."],

{id:12,title:"§ 12. Экономика",emoji:"💰",dia:"economy",
summary:["Экономика — способ организации деятельности по созданию благ и наука.","Термин ввёл Ксенофонт.","Блага — всё, что удовлетворяет потребности.","Стадии: производство → распределение → обмен → потребление.","Товары и услуги.","Ресурсы: трудовые, материальные, финансовые, природные.","Факторы: земля, капитал, труд, информация, предпринимательство.","Субъекты: домохозяйства, предприятия, государство.","Системы: традиционная, рыночная, плановая, смешанная."],
detailed:[{title:"Что такое экономика",text:"Слово «экономика» пришло из Древней Греции и означало «управление личным хозяйством». Сегодня у него два значения: 1) способ организации деятельности по созданию благ; 2) наука, которая исследует, как используются ограниченные ресурсы для удовлетворения неограниченных потребностей. Главные вопросы: что, как и для кого производить."},{title:"Стадии воспроизводства",text:"Общественное воспроизводство — непрерывный процесс из 4 стадий. Производство — создание благ. Распределение — установление доли каждого. Обмен — получение желаемого с предложением чего-то взамен. Потребление — непосредственное удовлетворение потребностей. Товары — блага для обмена. Услуги — действия, потребляемые в момент оказания."},{title:"Факторы производства",text:"Экономические ресурсы — все возможности общества для создания благ. Они ограничены. Та часть, что вовлечена в производство, называется факторами. Основные: земля (природные ресурсы), капитал (средства производства и финансы), труд (рабочая сила), информация (знания, технологии), предпринимательская способность (умение организовать и рисковать). Субъекты: домохозяйства, предприятия, государство."},{title:"Экономические системы",text:"Экономическая система — способ организации хозяйственной жизни. Традиционная: на обычаях, коллективной собственности. Рыночная: свободное предпринимательство, частная собственность, рыночные механизмы. Плановая: решения государства, директивное распределение, госсобственность. Смешанная: сочетание рынка и госрегулирования — характерна для большинства развитых стран, включая Беларусь."}],
keyPoints:["Экономика — способ организации деятельности по созданию благ и наука.","Термин ввёл Ксенофонт. 3 вопроса: что, как, для кого производить.","Стадии: производство → распределение → обмен → потребление.","Факторы: земля, капитал, труд, информация, предпринимательство.","Субъекты: домохозяйства, предприятия, государство.","Системы: традиционная, рыночная, плановая, смешанная.","Современная экономика — смешанная."],
test:[{q:"«Экономика» с греческого:",o:["Государство","Личное хозяйство","Торговля","Производство"],c:1},{q:"Кто ввёл понятие?",o:["Аристотель","Ксенофонт","Платон","Смит"],c:1},{q:"После производства:",o:["Обмен","Потребление","Распределение","Сбыт"],c:2},{q:"Факторы производства:",o:["Земля, капитал, труд, информация","Деньги","Труд","Земля"],c:0},{q:"Услуга — это:",o:["Товар","Действие в момент оказания","Ресурс","Фактор"],c:1},{q:"Что НЕ субъект экономики?",o:["Домохозяйства","Предприятия","Государство","Толпа"],c:3},{q:"Что такое экономика?",o:["Наука о природе","Способ организации деятельности","Политическая система","Религия"],c:1},{q:"Что относится к факторам производства?",o:["Земля, капитал, труд","Деньги","Только труд","Только земля"],c:0},{q:"Что такое смешанная экономика?",o:["Только госсобственность","Сочетание рынка и государства","Только рынок","Только традиции"],c:1},{q:"Какие главные вопросы экономики?",o:["Кто, где, когда","Что, как, для кого производить","Почему, зачем, сколько","Где, когда, почём"],c:1}],

{id:13,title:"§ 13. Собственность",emoji:"🏠",dia:"",
summary:["Собственность — отношения по присвоению благ.","Права: владение, пользование, распоряжение.","Формы: государственная, частная.","Способы приобретения: первоначальные и производные.","Приватизация — передача госсобственности в частную.","Доходы: первичные и вторичные.","Зарплата: повременная, сдельная.","Доходы: зарплата, рента, процент, прибыль, роялти.","БПМ — минимальный набор благ."],
detailed:[{title:"Собственность и её права",text:"Собственность — признанные обществом отношения по распределению и присвоению экономических благ. Собственность — не только вещь, но и отношения между людьми по поводу вещи. Права собственника: владение (реальное обладание), пользование (использование по назначению) и распоряжение (продажа, дарение, аренда). Собственник несёт бремя содержания и риск гибели имущества."},{title:"Формы собственности",text:"В законодательстве РБ зафиксированы две формы: государственная и частная. Частная бывает личной (предметы потребления), индивидуальной (средства производства) и коллективной (акционерная, кооперативная). Разгосударствление — уменьшение роли государства в экономике. Приватизация — передача госсобственности в частную. Национализация — обратный процесс."},{title:"Виды доходов",text:"Доходы — конечная цель экономической деятельности. Первичные получены в производстве: прибыль, зарплата. Вторичные формируются через перераспределение: пенсии, стипендии, пособия. Доходы по факторам: зарплата (труд), рента (земля), процент (капитал), прибыль (предпринимательство), роялти (авторские права). Бюджет прожиточного минимума (БПМ) — стоимость минимального набора благ; утверждается ежеквартально."}],
keyPoints:["Собственность — отношения по присвоению благ.","Права: владение, пользование, распоряжение.","Формы: государственная и частная (личная, индивидуальная, коллективная).","Приватизация — госсобственность → в частную. Национализация — наоборот.","Доходы: первичные (прибыль, зарплата) и вторичные (пенсии, стипендии).","Доходы по факторам: зарплата, рента, процент, прибыль, роялти.","БПМ — минимальный набор благ."],

summary:["Деньги — эквивалент стоимости, средство обращения, платежа, сбережения.","Функции: мера, обращение, платёж, сбережение, мировые.","Формы: товарные, металлические, бумажные, электронные.","Инфляция — обесценивание денег.","Кредитная система — учреждения, накапливающие и кредитующие.","Банк — финансовое учреждение.","Центробанк — эмиссия, резервы.","Депозит, кредит.","Принципы: возвратность, платность, срочность.","Кредиты: потребительский, автокредит, ипотечный. Лизинг."],
detailed:[{title:"Деньги и их функции",text:"Деньги — всеобщий эквивалент стоимости, средство обращения, платежа и сбережения. Функции: мера стоимости, средство обращения, средство платежа, средство сбережения, мировые деньги. Формы: товарные, металлические, бумажные, электронные. Сегодня преобладают безналичные деньги (записи на счетах)."},{title:"Инфляция и банки",text:"Инфляция — обесценивание денег из-за превышения их количества над товарным покрытием. Банки — финансовые учреждения, специализирующиеся на накоплении средств, кредитовании и посредничестве. Центральный банк (в РБ — Национальный) имеет исключительное право эмиссии, хранит золотовалютные резервы, регулирует банковскую сферу. Коммерческие банки обслуживают клиентов."},{title:"Кредит и вклады",text:"Депозит — сумма денег, размещённая вкладчиком в банке. Банк платит вкладчику проценты. Кредит — средства, предоставленные банком заёмщику. Принципы: возвратность, платность, срочность. Кредиты: потребительский, автокредит, ипотечный. Лизинг — долгосрочная аренда с правом выкупа."}],
keyPoints:["Деньги — эквивалент стоимости, средство обращения, платежа, сбережения.","5 функций: мера, обращение, платёж, сбережение, мировые.","Инфляция — обесценивание денег.","Центральный банк — эмиссия, резервы.","Депозит — вклад, кредит — ссуда.","Принципы кредитования: возвратность, платность, срочность.","Лизинг — аренда с выкупом."],

{id:15,title:"§ 15. Рынок",emoji:"🛒",dia:"supply",
summary:["Рынок — система отношений обмена.","Функции: ценообразующая, стимулирующая, информирующая, посредническая, оздоравливающая, регулирующая.","Спрос — желание и возможность купить. Предложение — готовность продать.","Факторы спроса: цена, доходы, вкусы, мода, сезонность.","Взаимозаменяемые и взаимодополняющие товары.","Равновесная цена — спрос = предложение.","Виды рынков: по объекту, территории, законности.","Биржа — форма оптового рынка."],
detailed:[{title:"Что такое рынок",text:"Рынок — система отношений обмена между покупателями и продавцами при посредстве денег. Функции: ценообразующая, стимулирующая, информирующая, посредническая, оздоравливающая, регулирующая. Условия: свободное ценообразование, конкуренция, свобода предпринимательства."},{title:"Спрос и предложение",text:"Спрос — желание и возможность покупателей приобрести товар. Факторы: цена, доходы, вкусы, мода, сезонность, цены на заменители и дополняющие товары. Предложение — готовность продавцов предложить товар. Взаимозаменяемые (масло-маргарин) — при росте цены на один растёт спрос на другой. Взаимодополняющие (авто-бензин) — потребляются вместе."},{title:"Равновесие и виды рынков",text:"Равновесная цена — при ней величина предложения равна величине спроса. Дефицит (спрос > предложение) — цена растёт. Излишек (предложение > спрос) — цена падает. Виды рынков: по объекту (сырья, недвижимости, труда), по территории (местный, национальный, международный), по законности (легальный, теневой). Биржа — форма регулярно функционирующего оптового рынка."}],
keyPoints:["Рынок — система отношений обмена.","Функции: ценообразующая, стимулирующая, информирующая, посредническая, оздоравливающая, регулирующая.","Спрос — желание и возможность купить. Предложение — готовность продать.","Взаимозаменяемые (масло-маргарин), взаимодополняющие (авто-бензин).","Равновесная цена — спрос = предложение.","Дефицит повышает цену, излишек понижает.","Биржа — форма оптового рынка."],

{id:16,title:"§ 16. Конкуренция",emoji:"🏆",dia:"",
summary:["Конкуренция — состязательность за выгодные условия.","Двигатель рыночной экономики.","Методы: ценовая и неценовая.","Отрасли: внутри- и межотраслевая.","Свобода: совершенная и несовершенная.","Несовершенная: монополистическая, олигополия, монополия.","Монополия — исключительное право.","Антимонопольное законодательство.","Менеджмент и маркетинг."],
detailed:[{title:"Что такое конкуренция",text:"Конкуренция — состязательность между экономическими субъектами за выгодные условия производства и реализации товаров. Конкуренция — «двигатель рыночной экономики»: стимулирует снижение затрат, повышение качества, внедрение технологий. По методам: ценовая и неценовая. По отраслям: внутриотраслевая и межотраслевая."},{title:"Совершенная и несовершенная",text:"Совершенная конкуренция — идеальная модель: много продавцов однородной продукции, нет барьеров входа. В реальности встречается редко (сельхозпродукты). Несовершенная конкуренция: монополистическая (много продавцов дифференцированной продукции — одежда, обувь), олигополия (несколько крупных фирм — автомобили, мобильная связь), монополия (один продавец — рынок электроэнергии, газа)."},{title:"Монополия и менеджмент",text:"Монополия — исключительное право производства и торговли, принадлежащее одному лицу или государству. Антимонопольное законодательство препятствует образованию монополий, кроме естественных (энергетика, газо-, водоснабжение). Менеджмент — принципы и методы управления. Маркетинг — деятельность по созданию, продвижению и предоставлению продукта покупателям. 4P: продукт, цена, позиция, продвижение."}],
keyPoints:["Конкуренция — состязательность за выгодные условия.","Методы: ценовая и неценовая.","Отрасли: внутри- и межотраслевая.","Несовершенная: монополистическая, олигополия, монополия.","Монополия — исключительное право.","Антимонопольное законодательство защищает конкуренцию.","Менеджмент — методы управления. Маркетинг — 4P."],

{id:17,title:"§ 17. Финансовая система",emoji:"🏦",dia:"",
summary:["Финансы — отношения по денежным средствам.","Финансовая система — сбор и распределение.","Бюджет — план доходов и расходов.","Виды: сбалансированный, дефицитный, профицитный.","Бюджетная система унитарного государства двухуровневая.","Налоги — обязательные платежи.","Прямые — с дохода и имущества.","Косвенные — в цене товаров (НДС, акцизы).","Ставки: пропорциональная, прогрессивная.","По сфере: общегосударственные и местные."],
detailed:[{title:"Финансы и бюджет",text:"Финансы — совокупность отношений, связанных с созданием и использованием денежных средств. Финансовая система — система сбора и распределения денежных средств. Бюджет — сводный план сбора доходов и использования средств на покрытие расходов. Бюджет бывает: сбалансированным (доходы = расходы), дефицитным (расходы > доходов) и профицитным (доходы > расходов). Бюджетная система унитарного государства двухуровневая: государственный и местные бюджеты."},{title:"Налоги и их виды",text:"Налоги — обязательные безвозмездные платежи граждан и юридических лиц государству. Функции: фискальная, регулирующая, распределительная, контрольная. Прямые взимаются с дохода и имущества напрямую: подоходный, на прибыль, на недвижимость, земельный. Косвенные включаются в цену товаров: НДС, акцизы, таможенные пошлины. Ставки подоходного налога: пропорциональная и прогрессивная."},{title:"По сфере распространения",text:"По сфере налоги делятся на общегосударственные (республиканские) и местные. Общегосударственные поступают в государственный бюджет и формируют его на 85–90%: большая часть налога на прибыль, НДС, таможенные пошлины. Местные налоги поступают в местные бюджеты: налог на недвижимость, земельный налог. В Беларуси действует система Tax Free: возврат НДС иностранным гражданам при выезде."}],
keyPoints:["Финансы — отношения по денежным средствам.","Бюджет: сбалансированный (равенство), дефицитный (расходы >), профицитный (доходы >).","Налоги — обязательные безвозмездные платежи.","Прямые — с дохода и имущества. Косвенные — в цене товаров.","Функции налогов: фискальная, регулирующая, распределительная, контрольная.","Ставки: пропорциональная и прогрессивная.","Налоги: общегосударственные и местные."],

{id:18,title:"§ 18. Государство и экономика",emoji:"📊",dia:"",
summary:["Государство регулирует экономику от кризисов.","Прямые методы: монополии, инвестиции, госпредприятия.","Косвенные: налоговая, денежная, социальная.","Инфляция: умеренная (до 10%), галопирующая (до 200%), гиперинфляция (>200%).","Безработица — часть не может трудоустроиться.","Виды: фрикционная, сезонная, структурная, циклическая.","Естественная = фрикционная + структурная.","Политика: пассивная и активная.","Социальная политика — уровень и качество жизни."],
detailed:[{title:"Методы регулирования",text:"Государство регулирует экономику, чтобы не допускать кризисов, обеспечивать занятость и социальную справедливость. Прямые методы: борьба с монополиями, инвестиции в отрасли, финансирование науки, создание госпредприятий, контроль экспорта и импорта. Косвенные методы: налоговая (фискальная), денежная (монетарная), социальная политика. Государство использует оба подхода в комплексе."},{title:"Инфляция и безработица",text:"Инфляция — рост цен и обесценивание денег. Виды по темпам: умеренная (до 10%), галопирующая (до 200%), гиперинфляция (>200%). Безработица — социально-экономическое явление, при котором часть активного населения не может трудоустроиться. Виды: фрикционная (поиск работы), сезонная, структурная (изменение структуры экономики), циклическая (при спаде). Естественная = фрикционная + структурная. Циклическая — признак проблем."},{title:"Политика занятости",text:"Государственная политика занятости: пассивная (пособия по безработице) и активная (переподготовка, общественные работы, стимулирование создания рабочих мест, поддержка малого бизнеса). Социальная политика направлена на повышение уровня и качества жизни, защиту уязвимых слоёв. В РБ гарантируется право на труд, пособие по безработице, минимальная зарплата."}],
keyPoints:["Прямые методы: монополии, инвестиции, госпредприятия. Косвенные: налоговая, денежная, социальная.","Инфляция: умеренная (до 10%), галопирующая (до 200%), гиперинфляция (>200%).","Безработица: фрикционная, сезонная, структурная, циклическая.","Естественная = фрикционная + структурная.","Политика занятости: пассивная (пособия) и активная (переподготовка).","Социальная политика — уровень и качество жизни."],

{id:19,title:"§ 19. Мораль",emoji:"☯️",dia:"",
summary:["Мораль — механизм регуляции через правила.","Термин ввёл Цицерон. Ось — добро и зло.","Структура: ценности, идеалы, нормы.","Нравственность — индивидуальные представления.","Моральные нормы меняются.","Профессиональная этика.","Золотое правило нравственности.","Категорический императив Канта.","Моральная дилемма."],
detailed:[{title:"Что такое мораль",text:"Мораль — механизм регуляции социальной жизни, основанный на принятых в обществе правилах поведения. За правилами стоят представления о том, что хорошо и что плохо. Основная ось морали — противоположность добра и зла. Термин ввёл Цицерон. Структура: ценности, идеалы, нормы. Мораль отличается от нравственности: мораль — общественные механизмы, нравственность — индивидуальные представления."},{title:"Профессиональная этика и дилеммы",text:"Профессиональная этика — повышенные моральные требования к некоторым профессиям (педагог, врач, юрист, учёный). Клятва Гиппократа — врачебная клятва, выражающая морально-этические принципы. Моральная дилемма — выбор между двумя возможностями, каждая из которых связана с нарушением моральных предписаний. Классический пример — «проблема вагонетки»."},{title:"Категорический императив",text:"Кант сформулировал высший принцип нравственности: «Поступай так, чтобы максима твоей воли могла быть всеобщим законом». Это значит: поступай так, чтобы твой поступок мог стать образцом для всех. Также Кант утверждал: «Человек всегда должен быть целью и никогда средством». Моральный закон делает человека свободным — он действует по убеждению, а не по принуждению."}],
keyPoints:["Мораль — механизм регуляции через правила. Ось — добро и зло.","Термин ввёл Цицерон. Структура: ценности, идеалы, нормы.","Нравственность — индивидуальные представления.","Профессиональная этика — повышенные требования.","Золотое правило: поступай с другими так, как хочешь, чтобы поступали с тобой.","Категорический императив Канта: поступай так, чтобы твой поступок мог стать всеобщим законом.","Моральная дилемма — выбор с нарушением предписаний."],

{id:20,title:"§ 20. Религия",emoji:"🕊️",dia:"",
summary:["Религия — вера в сверхъестественное и культ.","Ранние формы: фетишизм, анимизм, тотемизм, магия.","Признаки: удвоение мира, вера.","Структура: сознание, поведение, организация.","Функции: мировоззренческая, компенсаторная, интегративная, регулятивная, культуротворческая.","Типы: церковь, деноминация, секта, культ.","Мировые: буддизм, христианство, ислам.","Свобода совести и веротерпимость."],
detailed:[{title:"Что такое религия",text:"Религия — система верований в сверхъестественное и связанное с ней особое поведение (культ). Ранние формы: фетишизм (вера в силу предметов), анимизм (вера в душу и духов), тотемизм (связь с животными/растениями), магия (вера в сверхъестественные связи). Главные признаки религиозного мировоззрения: удвоение мира (обыденный и священный) и вера — знание, не требующее доказательств."},{title:"Структура и функции",text:"Структура религии: религиозное сознание, религиозное поведение, религиозная организация. Функции: мировоззренческая, компенсаторная, интегративно-коммуникационная, регулятивная, культуротворческая. Типы организаций: церковь (иерархия, лояльность государству), деноминация (активная пропаганда), секта (отвергает ценности культуры), культ (мистический опыт, харизматический лидер)."},{title:"Мировые религии",text:"Мировые религии — буддизм (VI в. до н.э., Индия), христианство (I в., Палестина), ислам (VII в., Западная Аравия). Признаки: космополитизм (единство веры выше национального), эгалитарность (равенство верующих), обещание справедливости в потустороннем мире. Свобода совести — право самостоятельно выбирать, верить или не верить. Веротерпимость — уважение к другим вероисповеданиям."}],
keyPoints:["Религия — вера в сверхъестественное и культ.","Ранние формы: фетишизм, анимизм, тотемизм, магия.","Структура: сознание, поведение, организация.","Функции: мировоззренческая, компенсаторная, интегративная, регулятивная, культуротворческая.","Мировые религии: буддизм, христианство, ислам.","Свобода совести — право выбирать религию."],

{id:21,title:"§ 21. Философия",emoji:"🤔",dia:"timeline",
summary:["Философия — форма теоретического мышления о реальности.","Возникла в VII–VI вв. до н.э. в Китае, Индии, Греции.","Структура: онтология, гносеология, антропология, этика, эстетика.","Отличается от мифа, искусства, религии.","Этапы: Античность, Средневековье, Возрождение, Новое время, современная.","Основные вопросы: мир, истина, человек, смысл.","Гносеология: оптимизм, агностицизм, скептицизм."],
detailed:[{title:"Что такое философия",text:"Философия — форма теоретического мышления, оперирующая абстрактными понятиями и формирующая систему знаний о наиболее общих и фундаментальных характеристиках реальности. Возникла в VII–VI вв. до н.э. почти одновременно в Древнем Китае, Древней Индии и Древней Греции. Это был период «осевого времени» — когда человечество осознало себя и начало задавать вечные вопросы. Философия отличается от мифа доказательностью, от искусства — рациональностью, от религии — опорой на разум."},{title:"Структура философии",text:"Структура: онтология (учение о бытии), гносеология (учение о познании), антропология (учение о человеке), социальная философия, этика, эстетика, религиоведение. Этапы западноевропейской философии: Античность, Средневековье (теоцентризм), Возрождение (гуманизм), Новое время (рационализм и эмпиризм), современная философия (множество школ)."},{title:"Гносеология и её подходы",text:"Гносеология — учение о познании. Три подхода: гносеологический оптимизм (мир познаваем), агностицизм (мир непознаваем — Кант), скептицизм (сомнение в возможности достоверного знания — Юм). Рационализм (Декарт): источник знания — разум. Эмпиризм (Бэкон): источник знания — опыт. Основные вопросы: что есть мир? истина? человек? в чём смысл жизни?"}],
keyPoints:["Философия — теоретическое мышление о реальности.","Возникла в VII–VI вв. до н.э. в Китае, Индии, Греции.","Структура: онтология, гносеология, антропология, этика, эстетика.","Отличается от мифа, искусства, религии.","Этапы: Античность, Средневековье, Возрождение, Новое время, современная.","Гносеология: оптимизм, агностицизм, скептицизм.","Рационализм (Декарт) — разум. Эмпиризм (Бэкон) — опыт."],

{id:22,title:"§ 22. Наука",emoji:"🔬",dia:"",
summary:["Наука — выработка и систематизация знаний, социальный институт.","Отличается инструментами и подготовкой.","Цель — истина.","Уровни: эмпирический и теоретический.","Классификация: гуманитарные, естественные, технические.","Исследования: фундаментальные и прикладные.","Институт: академическая и университетская.","Принципы Мертона.","Ответственность учёного."],
detailed:[{title:"Что такое наука",text:"Наука — деятельность по выработке и систематизации объективных знаний о мире, а также социальный институт. Научное познание отличается от обыденного: использует специальные инструменты (приборы и термины), требует специальной подготовки, систематизирует знания. Цель науки — постижение истины. Истина — соответствие знаний миру; она объективна. Правда, в отличие от истины, субъективна."},{title:"Уровни и классификация",text:"Уровни: эмпирический (результат — научный факт) и теоретический (результат — теория, гипотеза). Классификация: гуманитарные (психология, история), естественные (физика, химия), технические (электротехника, информатика). Исследования: фундаментальные (на открытие законов) и прикладные (на изобретение технологий). Наука как институт: академическая (НИИ, Академия наук) и университетская (вузы)."},{title:"Принципы научной этики",text:"Роберт Мертон сформулировал 4 принципа: универсализм (оценка идеи зависит от содержания, а не от авторитета автора), общность (результаты — общее достояние), бескорыстность (стремление к истине, а не к выгоде), организованный скептицизм (критическое отношение к любым идеям). Также важна ответственность учёного за последствия открытий."}],
keyPoints:["Наука — выработка и систематизация знаний; социальный институт.","Цель — истина. Истина объективна, правда субъективна.","Уровни: эмпирический (факт) и теоретический (теория, гипотеза).","Классификация: гуманитарные, естественные, технические.","Исследования: фундаментальные (законы) и прикладные (технологии).","Принципы Мертона: универсализм, общность, бескорыстность, организованный скептицизм.","Ответственность учёного за последствия открытий."],

{id:23,title:"§ 23. Образование",emoji:"🎓",dia:"edu",
summary:["Образование — обучение и воспитание.","Обучение — знания; воспитание — ценности.","Институт: учреждения, нормы, роли.","Система РБ: дошкольное, общее среднее, профтех, среднее специальное, высшее, послевузовское, дополнительное.","Тенденции: непрерывность, цифровизация, дистанционное.","Общество знания.","Компетенции XXI века: 4К.","Болонский процесс."],
detailed:[{title:"Что такое образование",text:"Образование — целенаправленный процесс обучения и воспитания, осуществляемый специально подготовленными людьми. Обучение — организация деятельности по усвоению знаний, умений и навыков. Воспитание — формирование ценностей, мировоззрения, личностных качеств. Образование как социальный институт включает: учреждения (школы, вузы), нормы и правила, роли (учитель, ученик), отношения. В РБ гарантируется право на образование (ст. 49 Конституции)."},{title:"Система образования в РБ",text:"Уровни в РБ: дошкольное, общее среднее (начальное, базовое, среднее), профессионально-техническое, среднее специальное, высшее, послевузовское, дополнительное. Также есть специальное образование для детей с особенностями развития. Тенденции: непрерывность (lifelong learning), цифровизация, дистанционное обучение, гуманизация."},{title:"Компетенции XXI века",text:"Общество знания — этап развития, где доминирующей ценностью становится знание. В таком обществе важны не только предметные знания, но и «4К»: критическое мышление, креативность, коммуникация, кооперация. Болонский процесс — сближение систем высшего образования стран Европы."}],
keyPoints:["Образование — обучение и воспитание специально подготовленными людьми.","Обучение — знания; воспитание — ценности.","Система РБ: дошкольное, общее среднее, профтех, среднее специальное, высшее, дополнительное.","Тенденции: непрерывность, цифровизация, дистанционное.","Общество знания — ценность знания.","Компетенции XXI века: 4К.","Болонский процесс — сближение систем ВО Европы."],

// Trail с остановкой rAF когда мышь не двигается
var mx=0,my=0,tx=0,ty=0,trailActive=false,trailTimer=null;
var isTouchDevice=window.matchMedia("(hover: none), (pointer: coarse)").matches;
document.addEventListener("mousemove",function(e){
  if(isTouchDevice)return;
  mx=e.clientX;my=e.clientY;
  if(!trailActive){trailActive=true;animTrail()}
  clearTimeout(trailTimer);
  trailTimer=setTimeout(function(){trailActive=false},800);
});
function animTrail(){
  if(!trailActive)return;
  tx+=(mx-tx)*0.18;ty+=(my-ty)*0.18;
  var t=$("trail");
  if(t)t.style.transform="translate3d("+(tx-35).toFixed(1)+"px,"+(ty-35).toFixed(1)+"px,0)";
  requestAnimationFrame(animTrail);
}
